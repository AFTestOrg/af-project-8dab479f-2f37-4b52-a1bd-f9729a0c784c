<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #111; background: #fff; font-family: system-ui, sans-serif; line-height: 1.5; }
    main { max-width: 48rem; margin: 0 auto; padding: clamp(1.5rem, 6vw, 4rem); }
    h1 { margin: 0 0 1.5rem; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.2; }
    a { display: inline-block; padding: 0.75rem 0; color: #0645ad; text-underline-offset: 0.2em; }
    a:focus-visible { outline: 3px solid #111; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
    <a href="/hello-world.pdf" download="hello-world.pdf">Download Hello World PDF</a>
  </main>
</body>
</html>
